#         preset: "Vocal Smooth"        # optional preset name
#         bypassed: false               # optional, default false
#         settings: "gentle leveling, ~3dB GR"
#         params:                       # optional structured values, units kept as text
#           Ratio: "3:1"
#           Threshold: "-22 dB"
#           Attack: "8 ms"
#         ref: "/Volumes/Music/MixPrep/presets/leadvox_proc2.aupreset"   # pointer only
